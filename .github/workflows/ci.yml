name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio
      - run: npm run quality:check
      - name: Validate local development configuration
        run: |
          ./bin/studio status
          docker compose --env-file .local/dev.env --file compose.yaml config --quiet
      - run: npm run build
        env:
          DATABASE_URL: postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio
      - run: docker build --tag screenshot-studio:${{ github.sha }} .
      - name: Smoke test production container
        run: |
          docker run --detach --rm --name screenshot-studio-smoke \
            --publish 3000:3000 \
            --env DATABASE_URL=postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio \
            screenshot-studio:${{ github.sha }}
          trap 'docker logs screenshot-studio-smoke || true; docker stop screenshot-studio-smoke || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: helm lint charts/screenshot-studio
      - run: helm template screenshot-studio charts/screenshot-studio > /dev/null
      - run: helm lint charts/screenshot-studio --values charts/screenshot-studio/values-kind.yaml --set existingSecret=screenshot-studio-local
      - run: helm template screenshot-studio charts/screenshot-studio --values charts/screenshot-studio/values-kind.yaml --set existingSecret=screenshot-studio-local > /dev/null

  integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          DATABASE_URL=postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio npx prisma generate
          npx playwright install --with-deps chromium
      - name: Start and smoke-test the local stack
        run: ./bin/studio up
      - name: Run local stack smoke test
        run: ./bin/studio smoke
      - name: Verify tenant isolation
        run: ./bin/studio tenant-isolation
      - name: Verify browser end-to-end flows
        run: make e2e
      - name: Verify dependency failure and recovery
        run: make e2e-recovery
      - if: failure()
        name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: always()
        name: Collect local stack logs
        run: docker compose --env-file .local/dev.env --file compose.yaml logs --no-color
      - if: always()
        name: Remove local stack data
        run: ./bin/studio down --purge --yes
