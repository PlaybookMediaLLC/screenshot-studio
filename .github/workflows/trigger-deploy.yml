name: Deploy Trigger.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production tasks
    runs-on: ubuntu-latest
    environment: production
    # Skip when the deploy is not configured instead of failing.
    #
    # TRIGGER_ACCESS_TOKEN has never been set on this repository, so every
    # push to main produced a red X on a workflow that cannot run: "You must
    # login first ... set the TRIGGER_ACCESS_TOKEN environment variable". A
    # permanent failure trains readers to ignore the checks and hides real
    # ones. It sat beside genuinely broken CI for days and was dismissed as
    # "pre-existing and unrelated" every time.
    #
    # The gate reads TRIGGER_PROJECT_REF rather than the token because the
    # secrets context is not available in a job-level `if`. Both are unset
    # together, and a deploy needs the project ref anyway, so it is an
    # accurate proxy for "this deploy is configured".
    #
    # Nothing is disabled: set the variable and the secret and this runs on
    # the next push, with no workflow change.
    if: vars.TRIGGER_PROJECT_REF != ''
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio
      - run: npm run lint
      - run: npx tsc --noEmit

      - name: Deploy tasks
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
        run: npm run trigger:deploy -- --env prod
