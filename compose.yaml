name: screenshot-studio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    env_file: .local/dev.env
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      NODE_ENV: development
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      POSTIZ_API_URL: ${POSTIZ_API_URL:-}
      SCREENSHOT_API_URL: ${SCREENSHOT_API_URL:-https://api.microlink.io}
      SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS: ${SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS:-}
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
      - app_next_cache:/workspace/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-bookworm
    env_file: .local/dev.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=postgres --dbname=postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    image: bitnamilegacy/pgbouncer:latest
    env_file: .local/dev.env
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: '5432'
      POSTGRESQL_DATABASE: storage
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:63799:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    env_file: .local/dev.env
    command: server --console-address :9001 /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9003:9000'
      - '127.0.0.1:9004:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    env_file: .local/dev.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET}'

  imgproxy:
    image: darthsim/imgproxy:v3.26.0
    environment:
      IMGPROXY_USE_ETAG: 'true'
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: 'true'
    ports:
      - '127.0.0.1:50020:8080'

  screenshot-mock:
    image: node:22-alpine
    profiles: ['e2e']
    command: node scripts/e2e-screenshot-mock.mjs
    working_dir: /workspace
    volumes:
      - .:/workspace:ro

  storage:
    image: supabase/storage-api:v1.37.8
    env_file: .local/dev.env
    environment:
      SERVER_PORT: '5000'
      AUTH_JWT_SECRET: ${STORAGE_JWT_SECRET}
      AUTH_JWT_ALGORITHM: HS256
      DATABASE_URL: ${STORAGE_DATABASE_URL}
      DATABASE_POOL_URL: ${STORAGE_DATABASE_POOL_URL}
      DB_INSTALL_ROLES: 'true'
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: ${STORAGE_BUCKET}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      UPLOAD_FILE_SIZE_LIMIT: '524288000'
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: '52428800'
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: '120'
      TUS_URL_PATH: /upload/resumable
      TUS_URL_EXPIRY_MS: '3600000'
      ENABLE_IMAGE_TRANSFORMATION: 'true'
      IMGPROXY_URL: http://imgproxy:8080
      IMGPROXY_REQUEST_TIMEOUT: '15'
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  storage-init:
    image: curlimages/curl:8.12.1
    env_file: .local/dev.env
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        until curl --fail --silent http://storage:5000/status >/dev/null; do sleep 1; done
        if curl --fail --silent \
          --header "authorization: Bearer $${STORAGE_SERVICE_KEY}" \
          --header "apikey: $${STORAGE_SERVICE_KEY}" \
          http://storage:5000/bucket/$${STORAGE_BUCKET} >/dev/null; then exit 0; fi
        curl --fail --silent --show-error \
          --request POST http://storage:5000/bucket \
          --header "authorization: Bearer $${STORAGE_SERVICE_KEY}" \
          --header "apikey: $${STORAGE_SERVICE_KEY}" \
          --header "content-type: application/json" \
          --data "{\"id\":\"$${STORAGE_BUCKET}\",\"name\":\"$${STORAGE_BUCKET}\",\"public\":false}" >/dev/null
    depends_on:
      storage:
        condition: service_started

  trigger-dev:
    profiles: ['trigger']
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx trigger.dev@4.5.11 dev --config trigger.config.ts --profile screenshot-studio-local
    env_file: .local/dev.env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/workspace
      - trigger_node_modules:/workspace/node_modules
      - ./.local/trigger:/root/.trigger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  app_next_cache:
  app_node_modules:
  minio_data:
  postgres_data:
  redis_data:
  trigger_node_modules:
