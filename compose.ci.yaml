services:
  app:
    # Match production: Turbopack 16.3 misparses Google Font URLs in this container.
    command: npm run dev -- --webpack
    environment:
      # Avoid Next restarting midway through the browser suite at its default heap limit.
      NODE_OPTIONS: --max-old-space-size=4096
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  # The backend and worker call the same host-side e2e mocks as the app.
  publishing-backend:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  publishing-orchestrator:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
