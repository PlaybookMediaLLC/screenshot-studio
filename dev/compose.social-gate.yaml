# Overlay on compose.yaml with a separate Compose project. Every durable
# dependency, browser port, and fake destination belongs to this gate only.
services:
  app:
    environment:
      BETTER_AUTH_URL: http://localhost:3010
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3010
      NEXT_PUBLIC_APP_URL: http://localhost:3010
      # Drafts may target the fake destination under X's rules, as on publishing-backend.
      PLATFORM_E2E_DRAFT_PLATFORM: enabled
    ports: !override
      - '127.0.0.1:3010:3000'

  postgres:
    ports: !override
      - '127.0.0.1:54349:5432'

  redis:
    ports: !override
      - '127.0.0.1:63809:6379'

  rustfs:
    ports: !override
      - '127.0.0.1:9013:9000'
      - '127.0.0.1:9014:9001'

  # The Go services share one image tag, so they all build with the e2e tag.
  # The gate's own tag keeps the dev image free of e2e-only code.
  publishing-backend:
    image: screenshot-studio-backend:social-gate
    build:
      args:
        GO_BUILD_TAGS: e2e
    # Channels connect in process (no SOCIAL_API_URL) to the fake provider.
    environment:
      BETTER_AUTH_URL: http://localhost:3010
      # The fake destination takes content drafts under X's rules.
      PLATFORM_E2E_DRAFT_PLATFORM: enabled
      R2_BROWSER_ENDPOINT: http://localhost:9013
      SOCIAL_API_URL: ''
      SOCIAL_E2E_URL: http://fake-social:8080
    ports: !override
      - '127.0.0.1:8180:8080'
    depends_on:
      fake-social:
        condition: service_healthy

  platform-go-migrate:
    image: screenshot-studio-backend:social-gate
    build:
      args:
        GO_BUILD_TAGS: e2e

  publishing-orchestrator:
    image: screenshot-studio-backend:social-gate
    build:
      args:
        GO_BUILD_TAGS: e2e
    environment:
      SOCIAL_E2E_URL: http://fake-social:8080
    ports: !override
      - '127.0.0.1:8181:8081'
    depends_on:
      fake-social:
        condition: service_healthy

  temporal:
    ports: !override []

  fake-social:
    image: node:22.23.4-alpine
    command: node /fake-social.mjs
    environment:
      SOCIAL_E2E_MEDIA_ORIGIN: http://rustfs:9000
    volumes:
      - ../clients/apps/web/test/e2e/fixtures/fake-social.mjs:/fake-social.mjs:ro
    ports:
      - '127.0.0.1:5680:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
