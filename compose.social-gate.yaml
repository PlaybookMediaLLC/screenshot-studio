# Run with --project-name screenshot-studio-social-gate so its Postiz database,
# Redis, Temporal history, and fake destination cannot touch local live data.
services:
  postiz-go-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: postiz_go
      POSTGRES_USER: postiz_go
      POSTGRES_PASSWORD: local-social-gate-only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz_go -d postiz_go']
      interval: 5s
      timeout: 5s
      retries: 20

  postiz-go-redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  postiz-go-temporal:
    image: temporalio/temporal:1.8.2
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 2s
      retries: 30

  postiz-go-migrate:
    build:
      context: ./services
      dockerfile: screenshot-studio-backend/backend/Dockerfile
      args:
        GO_BUILD_TAGS: e2e
    image: screenshot-studio-postiz-backend:e2e
    entrypoint: ['/postiz-migrate']
    environment:
      DATABASE_URL: postgresql://postiz_go:local-social-gate-only@postiz-go-db:5432/postiz_go?sslmode=disable
    depends_on:
      postiz-go-db:
        condition: service_healthy

  fake-social:
    image: node:22-alpine
    command: node /fake-social.mjs
    environment:
      POSTIZ_E2E_MEDIA_ORIGIN: http://rustfs:9000
    volumes:
      - ./e2e/fixtures/fake-social.mjs:/fake-social.mjs:ro
    ports:
      - '127.0.0.1:5680:8080'
    networks: [default, web]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  screenshot-studio-backend:
    build:
      context: ./services
      dockerfile: screenshot-studio-backend/backend/Dockerfile
      args:
        GO_BUILD_TAGS: e2e
    image: screenshot-studio-postiz-backend:e2e
    environment: &postiz-environment
      DATABASE_URL: postgresql://postiz_go:local-social-gate-only@postiz-go-db:5432/postiz_go?sslmode=disable
      REDIS_URL: redis://postiz-go-redis:6379
      TEMPORAL_ADDRESS: postiz-go-temporal:7233
      JWT_SECRET: local-social-gate-only
      FRONTEND_URL: http://localhost:3000
      MAIN_URL: http://localhost:3110
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3110
      BACKEND_INTERNAL_URL: http://screenshot-studio-backend:3000
      POSTIZ_E2E_SOCIAL_URL: http://fake-social:8080
      POSTIZ_E2E_R2_ENDPOINT: http://rustfs:9000
      STORAGE_PROVIDER: cloudflare
      POSTIZ_PRIVATE_MEDIA: 'true'
      CLOUDFLARE_ACCOUNT_ID: local
      CLOUDFLARE_ACCESS_KEY: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in the local test env}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in the local test env}
      CLOUDFLARE_REGION: ${R2_REGION:-us-east-1}
      CLOUDFLARE_BUCKETNAME: ${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in the local test env}
      CLOUDFLARE_BUCKET_URL: http://rustfs:9000/${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in the local test env}
      RUN_CRON: 'true'
      PORT: '3000'
    networks:
      default: {}
      web:
        aliases: [social-gate-go]
    ports:
      - '127.0.0.1:3110:3000'
    depends_on:
      postiz-go-migrate:
        condition: service_completed_successfully
      postiz-go-redis:
        condition: service_healthy
      postiz-go-temporal:
        condition: service_healthy
      fake-social:
        condition: service_healthy

  screenshot-studio-orchestrator:
    build:
      context: ./services
      dockerfile: screenshot-studio-backend/orchestrator/Dockerfile
      args:
        GO_BUILD_TAGS: e2e
    image: screenshot-studio-postiz-orchestrator:e2e
    entrypoint: ['/screenshot-studio-orchestrator']
    environment:
      <<: *postiz-environment
      ORCHESTRATOR_PORT: '3002'
    networks: [default, web]
    ports:
      - '127.0.0.1:3112:3002'
    depends_on:
      postiz-go-migrate:
        condition: service_completed_successfully
      postiz-go-redis:
        condition: service_healthy
      postiz-go-temporal:
        condition: service_healthy
      fake-social:
        condition: service_healthy

networks:
  web:
    external: true
    name: ${SOCIAL_GATE_WEB_NETWORK:-screenshot-studio_default}
