name: Publish SDK

# Publishes packages/screenshot-studio-backend-sdk to npm when main carries a
# version npm does not have. Pull requests run the same build and fail when
# the SDK changed but its version did not, which would otherwise never
# publish. npm trusted publishing (OIDC) authenticates, so no npm token is
# stored; an NPM_TOKEN secret is used only if one is set.
on:
  push:
    branches: [main]
    paths:
      - packages/screenshot-studio-backend-sdk/**
      - .github/workflows/publish-sdk.yml
  pull_request:
    paths:
      - packages/screenshot-studio-backend-sdk/**
      - .github/workflows/publish-sdk.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/screenshot-studio-backend-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      # The app's TypeScript, without installing the app: its lockfile may
      # already pin the version this run is about to publish.
      - name: Build
        run: |
          typescript="$(node -p "require('../../package.json').devDependencies.typescript")"
          npx --yes --package "typescript@$typescript" tsc -p tsconfig.json
      - id: version
        name: Compare with npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" != "$version" ]; then
            echo "$name@$version is not on npm yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An unchanged version must mean unchanged contents.
          mkdir -p "$RUNNER_TEMP/published"
          npm pack "$name@$version" --pack-destination "$RUNNER_TEMP/published" > /dev/null
          tar -xzf "$RUNNER_TEMP"/published/*.tgz -C "$RUNNER_TEMP/published"
          if ! diff -r "$RUNNER_TEMP/published/package/dist" dist; then
            echo "::error::$name@$version is already on npm with different contents. Bump the version in packages/screenshot-studio-backend-sdk/package.json."
            exit 1
          fi
          echo "$name@$version is already on npm with these contents."
          echo "publish=false" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.version.outputs.publish == 'true' && github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The build ran above; prepack would look for tsc on the PATH.
        run: npm publish --access public --ignore-scripts
