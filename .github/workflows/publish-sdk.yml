name: Publish SDK

# Publishes packages/screenshot-studio-backend-sdk to npm when main carries a
# version npm does not have. Pull requests run the check alone, which fails
# when the SDK changed but its version did not (that change would never
# publish). npm trusted publishing (OIDC) authenticates; no npm token is
# stored. Only the publish job can ask for one, through the npm environment,
# which deploys from main alone, and npm trusts only that environment.
on:
  push:
    branches: [main]
    paths:
      - packages/screenshot-studio-backend-sdk/**
      - .github/workflows/publish-sdk.yml
  pull_request:
    branches: [develop, main]
    paths:
      - packages/screenshot-studio-backend-sdk/**
      - .github/workflows/publish-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    defaults:
      run:
        working-directory: packages/screenshot-studio-backend-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      # Install the SDK's locked peer dependencies without installing the app:
      # the app may already pin the SDK version this run is about to publish.
      - name: Install SDK dependencies
        working-directory: .
        run: npm ci --ignore-scripts --workspace screenshot-studio-backend-sdk --include-workspace-root=false --no-audit --no-fund
      # Use the app's compiler version for reproducible declarations.
      - name: Build
        run: |
          typescript="$(node -p "require('../../package.json').devDependencies.typescript")"
          npx --yes --package "typescript@$typescript" tsc -p tsconfig.json
      - id: version
        name: Compare with npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" != "$version" ]; then
            echo "$name@$version is not on npm yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An unchanged version must mean unchanged contents.
          mkdir -p "$RUNNER_TEMP/published"
          npm pack "$name@$version" --pack-destination "$RUNNER_TEMP/published" > /dev/null
          tar -xzf "$RUNNER_TEMP"/published/*.tgz -C "$RUNNER_TEMP/published"
          if ! diff -r "$RUNNER_TEMP/published/package/dist" dist; then
            echo "::error::$name@$version is already on npm with different contents. Bump the version in packages/screenshot-studio-backend-sdk/package.json."
            exit 1
          fi
          echo "$name@$version is already on npm with these contents."
          echo "publish=false" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/screenshot-studio-backend-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - name: Install SDK dependencies
        working-directory: .
        run: npm ci --ignore-scripts --workspace screenshot-studio-backend-sdk --include-workspace-root=false --no-audit --no-fund
      - name: Build
        run: |
          typescript="$(node -p "require('../../package.json').devDependencies.typescript")"
          npx --yes --package "typescript@$typescript" tsc -p tsconfig.json
      # The build ran above; prepack would look for tsc on the PATH.
      - run: npm publish --access public --ignore-scripts
