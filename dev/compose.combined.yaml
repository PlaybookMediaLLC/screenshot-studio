# Overlay on compose.yaml with a separate Compose project. It runs the
# production image with its default entry point (server/cmd/combined), which
# starts the social API, the product API, and the product worker in one
# container. dev/combined-check uses it. Only the readiness port is published.
services:
  combined-backend:
    extends:
      file: compose.yaml
      service: screenshot-studio-backend
    profiles: !override ['combined']
    entrypoint: ['/combined-backend']
    # Production passes the product settings with a TENANT_ prefix;
    # dev/combined-check writes this file from .local/dev.env.
    env_file: ../.local/combined.env
    environment:
      BACKEND_INTERNAL_URL: http://127.0.0.1:3000
      TENANT_DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      TENANT_AUDIT_RETENTION_DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      TENANT_TEMPORAL_ADDRESS: temporal:7233
      TENANT_TEMPORAL_NAMESPACE: default
      TENANT_SOCIAL_API_URL: http://127.0.0.1:3000/public/v1
      TENANT_PUBLISHING_SERVICE_TOKEN: ${PUBLISHING_SERVICE_TOKEN:-local-publishing-service}
      TENANT_RUN_MAINTENANCE: 'true'
      TENANT_RUN_CRON: 'true'
      # Maintenance requires a mail sender and an HTTPS app URL for its links; the
      # empty database has no mail to send.
      TENANT_BETTER_AUTH_URL: https://localhost:3000
      TENANT_RESEND_API_KEY: ${RESEND_API_KEY:-re_combined_check}
      TENANT_AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Screenshot Studio <noreply@example.com>}
    ports: !override
      - '127.0.0.1:3303:3003'
    depends_on:
      platform-go-migrate:
        condition: service_completed_successfully
      social-redis:
        condition: service_healthy
      social-temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  postgres:
    ports: !override []

  redis:
    ports: !override []

  rustfs:
    ports: !override []

  temporal:
    ports: !override []

  social-temporal:
    ports: !override []
