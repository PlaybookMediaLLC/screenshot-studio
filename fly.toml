app = "screenshot-studio-playbook"
# First deploy starts in IAD. The workflow chooses the Fly app and regions
# from its GitHub Environment.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "3000"
  SCREENSHOT_API_URL = "https://api.microlink.io"
  # The storage gateway sends no CORS headers, so browsers cannot PUT to
  # its signed URLs directly. Signed transfers route through the
  # authenticated same-origin proxy at /api/tenant/storage instead.
  STORAGE_PROXY_URL = "https://shots.oppulence.io/api/tenant/storage"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 35

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[processes]
  app = "node server.js"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
