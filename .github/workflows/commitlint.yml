name: Commitlint

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - run: npm ci
        working-directory: clients
      - name: Check pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: clients
        run: |
          # Lint commits authored on the PR's first-parent history. A fork sync
          # intentionally imports upstream commits as a merge's second parent,
          # and those messages are outside this repository's commit convention.
          while read -r commit; do
            git show --quiet --format=%B "$commit" | npm run commitlint -- --verbose
          done < <(git rev-list --first-parent --reverse "$BASE_SHA..$HEAD_SHA")
