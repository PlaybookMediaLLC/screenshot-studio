name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAINTENANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maintenance_test?sslmode=disable
      POSTIZ_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postiz_test?sslmode=disable
      PUBLISHING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shared_cutover_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: publishing_acceptance
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=publishing_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: go generate ./ent ./screenshot-studio-backend/ent
      - name: Verify generated Ent clients are current
        run: git diff --exit-code -- ent screenshot-studio-backend/ent
      - name: Create the Postiz Go test database
        run: psql postgresql://postgres:postgres@127.0.0.1:5432/publishing_acceptance -c 'CREATE DATABASE postiz_test'
      - name: Create and migrate maintenance test database
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/publishing_acceptance -c 'CREATE DATABASE maintenance_test'
          DATABASE_URL="$MAINTENANCE_TEST_DATABASE_URL" go run ./cmd/platform-migrate
      - name: Verify one public schema for product and social Ent models
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/publishing_acceptance -c 'CREATE DATABASE shared_cutover_test'
          DATABASE_URL="$PUBLISHING_TEST_DATABASE_URL" go run ./cmd/platform-migrate
          go test ./internal/publishing -run TestOAuthGrantAndConnectionUseEntInOnePublicSchema -count=1
          go test ./screenshot-studio-backend/tenantpublishing -run TestDirectPublisherUsesSharedPublicSchemaWithoutLegacyPost -count=1
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - name: Verify Postiz migrations are repeatable
        run: |
          DATABASE_URL="$POSTIZ_TEST_DATABASE_URL" go run ./screenshot-studio-backend/cmd/postiz-migrate
          DATABASE_URL="$POSTIZ_TEST_DATABASE_URL" go run ./screenshot-studio-backend/cmd/postiz-migrate
      - run: go test -race ./backend/internal/httpapi ./internal/postiz ./internal/publishing ./internal/temporalpublishing ./internal/maintenance ./internal/temporalmaintenance ./internal/onboarding ./internal/temporalonboarding ./internal/enrichment ./screenshot-studio-backend/tenantpublishing
      - run: go test -race ./screenshot-studio-backend/backend/auth ./screenshot-studio-backend/internal/database/users ./screenshot-studio-backend/orchestrator/...
      - run: go vet ./...
      - name: Build publishing service images
        working-directory: .
        run: |
          docker build --file services/backend/Dockerfile --tag screenshot-studio-publishing-backend:${{ github.sha }} services
          docker build --file services/orchestrator/Dockerfile --tag screenshot-studio-publishing-orchestrator:${{ github.sha }} services
          docker build --file services/screenshot-studio-backend/backend/Dockerfile --tag screenshot-studio-backend:${{ github.sha }} services

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The collaboration server's replica test relays edits through a real Redis.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      COLLAB_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Workspace scripts, as the SDK publish path builds it.
      - run: npm run build:sdk
      - run: python3 -m unittest discover -s infra/digitalocean -p 'test_*.py'
      - run: npm run quality:check
      - run: npm run test:publishing-backend-client
      - run: npm run test:screenshot-capture
      - name: Validate local development configuration
        run: |
          ./bin/studio status
          docker compose --env-file .local/dev.env --file compose.yaml config --quiet
      # The Docker build runs `npm run build` inside the image, so a bare
      # `npm run build` here would validate the same thing twice. The
      # GitHub Actions layer cache keeps the dependency and build layers
      # warm between runs.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: screenshot-studio:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        run: |
          # No database: the web reaches all data through the Go backend.
          docker run --detach --rm --name screenshot-studio-smoke \
            --publish 3000:3000 \
            screenshot-studio:${{ github.sha }}
          trap 'docker logs screenshot-studio-smoke || true; docker stop screenshot-studio-smoke || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build and smoke test the collaboration server image
        run: |
          docker build --file packages/collab-server/Dockerfile --tag screenshot-studio-collab:${{ github.sha }} .
          docker run --detach --rm --name collab-smoke --publish 1234:1234 \
            --env COLLAB_BACKEND_URL=http://127.0.0.1:9 --env COLLAB_SERVICE_TOKEN=smoke \
            screenshot-studio-collab:${{ github.sha }}
          trap 'docker logs collab-smoke || true; docker stop collab-smoke || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:1234/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: helm lint charts/screenshot-studio
      - run: helm template screenshot-studio charts/screenshot-studio > /dev/null
      - run: helm lint charts/screenshot-studio --values charts/screenshot-studio/values-kind.yaml --set existingSecret=screenshot-studio-local
      - run: helm template screenshot-studio charts/screenshot-studio --values charts/screenshot-studio/values-kind.yaml --set existingSecret=screenshot-studio-local > /dev/null

  # The public contract: the committed OpenAPI document and typed client must
  # match the zod contracts, and a pull request may not break the document
  # unless the break is listed in breaking-changes-allowed.txt (RFC 034).
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache: false
      - run: npm ci
      - name: Verify the OpenAPI document and typed client are current
        run: |
          npm run api:generate
          git diff --exit-code -- services/internal/shotsapi packages/shots-api-client/src
      - name: Build the typed client
        run: npx tsc -p packages/shots-api-client/tsconfig.json --noEmit
      - name: Block unintended breaking API changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          document=services/internal/shotsapi/openapi.json
          if ! git cat-file -e "$BASE:$document" 2>/dev/null; then
            echo "The base revision has no OpenAPI document to compare against."
            exit 0
          fi
          git show "$BASE:$document" > "$RUNNER_TEMP/base-openapi.json"
          go run github.com/oasdiff/oasdiff@v1.33.0 breaking "$RUNNER_TEMP/base-openapi.json" "$document" \
            --fail-on ERR --format githubactions \
            --err-ignore services/internal/shotsapi/breaking-changes-allowed.txt

  # Runs in parallel with validate rather than after it. The two jobs
  # share no outputs, and the serial order added the whole validate
  # duration to every release. The cost is integration runner minutes
  # on changes that fail validation.
  integration:
    runs-on: ubuntu-latest
    # Stack start, route warm-up, a third of the suite with retries, and on
    # the last shard the recovery check; 30 minutes no longer covered it.
    timeout-minutes: 45
    env:
      E2E_DOCKER_HOST_GATEWAY: 'true'
    strategy:
      fail-fast: false
      # Three shards keep each job inside its 30 minutes: shard 1 also tests
      # the render service and the last shard runs the recovery check.
      matrix:
        include:
          - shard: '1/3'
            shard_index: 1
          - shard: '2/3'
            shard_index: 2
          - shard: '3/3'
            shard_index: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test dependencies
        # Bounded because a hung browser download otherwise consumes the
        # whole job budget and reports a timeout with no diagnostic, which
        # reads as a test failure rather than an infrastructure one.
        timeout-minutes: 8
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test the design renderer over CDP
        # Real Chromium over CDP, the path Cloudflare Browser Rendering uses in
        # production. Once is enough, so only on shard 1.
        if: matrix.shard_index == 1
        timeout-minutes: 5
        run: npm run test:design-renderer
      - name: Start and smoke-test the local stack
        run: ./bin/studio up
      - name: Run local stack smoke test
        run: ./bin/studio smoke
      - name: Smoke test the API reference, OpenAPI document, and agent endpoints
        if: matrix.shard_index == 1
        run: VERIFY_BASE_URL=http://127.0.0.1:3000 npm run verify:agents
      - name: Verify tenant isolation
        run: ./bin/studio tenant-isolation
      - name: Verify browser end-to-end flows
        run: ./bin/studio e2e --shard=${{ matrix.shard }}
      # Collected before the recovery check, which calls `compose up
      # --force-recreate app` and so destroys the container that served the
      # failing tests. Collecting only at the end left every failure on the
      # recovery shard with no server-side evidence, which is why the
      # two-factor flake could not be diagnosed from CI output.
      - if: always()
        name: Collect end-to-end stack logs
        run: docker compose --env-file .local/dev.env --file compose.yaml --profile e2e logs --no-color
      - name: Verify dependency failure and recovery
        if: matrix.shard_index == 3
        run: make e2e-recovery
      - if: failure()
        name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ matrix.shard_index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: always()
        name: Collect post-recovery stack logs
        run: docker compose --env-file .local/dev.env --file compose.yaml --profile e2e logs --no-color
      - if: always()
        name: Remove local stack data
        run: ./bin/studio down --purge --yes

  social-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependencies
        timeout-minutes: 8
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run real Go social publishing gate
        run: ./bin/social-gate
      - if: failure()
        name: Upload browser test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: social-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
