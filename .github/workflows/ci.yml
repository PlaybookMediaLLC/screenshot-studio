name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISHING_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/publishing_acceptance?sslmode=disable
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: publishing_acceptance
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=publishing_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - uses: temporalio/setup-temporal@9af5459e9d25cd191f5384fbd0659858e7633b23
        with:
          version: 1.8.2
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: go generate ./ent
      - name: Verify generated Ent client is current
        run: git diff --exit-code -- ent
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test -race ./backend/internal/httpapi ./internal/postiz ./internal/publishing ./internal/storage ./internal/temporalpublishing
      - run: go vet ./...
      - name: Exercise publishing service interfaces
        run: make acceptance
      - name: Build publishing service images
        working-directory: .
        run: |
          docker build --file services/backend/Dockerfile --tag screenshot-studio-publishing-backend:${{ github.sha }} services
          docker build --file services/orchestrator/Dockerfile --tag screenshot-studio-publishing-orchestrator:${{ github.sha }} services

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio
      - run: npm run quality:check
      - name: Validate local development configuration
        run: |
          ./bin/studio status
          docker compose --env-file .local/dev.env --file compose.yaml config --quiet
      # The Docker build runs `npm run build` inside the image, so a bare
      # `npm run build` here would validate the same thing twice. The
      # GitHub Actions layer cache keeps the dependency and build layers
      # warm between runs.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: screenshot-studio:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        run: |
          docker run --detach --rm --name screenshot-studio-smoke \
            --publish 3000:3000 \
            --env DATABASE_URL=postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio \
            screenshot-studio:${{ github.sha }}
          trap 'docker logs screenshot-studio-smoke || true; docker stop screenshot-studio-smoke || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: helm lint charts/screenshot-studio
      - run: helm template screenshot-studio charts/screenshot-studio > /dev/null
      - run: helm lint charts/screenshot-studio --values charts/screenshot-studio/values-kind.yaml --set existingSecret=screenshot-studio-local
      - run: helm template screenshot-studio charts/screenshot-studio --values charts/screenshot-studio/values-kind.yaml --set existingSecret=screenshot-studio-local > /dev/null

  # Runs in parallel with validate rather than after it. The two jobs
  # share no outputs, and the serial order added the whole validate
  # duration to every release. The cost is integration runner minutes
  # on changes that fail validation.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DOCKER_HOST_GATEWAY: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            shard_index: 1
          - shard: '2/2'
            shard_index: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test dependencies
        # Bounded because a hung browser download otherwise consumes the
        # whole job budget and reports a timeout with no diagnostic, which
        # reads as a test failure rather than an infrastructure one.
        timeout-minutes: 8
        run: |
          npm ci
          DATABASE_URL=postgresql://screenshot_studio:screenshot_studio@localhost:5432/screenshot_studio npx prisma generate
          npx playwright install --with-deps chromium
      - name: Start and smoke-test the local stack
        run: ./bin/studio up
      - name: Run local stack smoke test
        run: ./bin/studio smoke
      - name: Verify tenant isolation
        run: ./bin/studio tenant-isolation
      - name: Verify browser end-to-end flows
        run: ./bin/studio e2e --shard=${{ matrix.shard }}
      # Collected before the recovery check, which calls `compose up
      # --force-recreate app` and so destroys the container that served the
      # failing tests. Collecting only at the end left every shard-1 failure
      # with no server-side evidence, which is why the two-factor flake could
      # not be diagnosed from CI output.
      - if: always()
        name: Collect end-to-end stack logs
        run: docker compose --env-file .local/dev.env --file compose.yaml --profile e2e logs --no-color
      - name: Verify dependency failure and recovery
        if: matrix.shard_index == 1
        run: make e2e-recovery
      - if: failure()
        name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ matrix.shard_index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: always()
        name: Collect post-recovery stack logs
        run: docker compose --env-file .local/dev.env --file compose.yaml --profile e2e logs --no-color
      - if: always()
        name: Remove local stack data
        run: ./bin/studio down --purge --yes
