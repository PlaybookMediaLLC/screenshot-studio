name: Release Please

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      release_as:
        description: Optional explicit version for a release-preparation PR on develop
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for any prepared version to be released
        id: pending
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('./package.json').version;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag: `v${version}`});
              core.setOutput('ready', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Version ${version} is prepared but not released. Promote develop to main first.`);
              core.setOutput('ready', 'false');
            }
      # The PAT lets GitHub run CI for the generated PR. A GITHUB_TOKEN PR
      # needs a human close/reopen before required PR checks will be emitted.
      - name: Check the release token
        if: steps.pending.outputs.ready == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is unset. Reopen the generated PR to trigger its required CI checks."
          fi
      - name: Open version and changelog PR into develop
        if: steps.pending.outputs.ready == 'true'
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          target-branch: develop
          release-as: ${{ inputs.release_as || '' }}
          skip-github-release: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      # Labelling the released preparation PR "autorelease: tagged" is a PR
      # write; with read access GitHub refuses it (403) after publishing.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the promoted version
        uses: actions/github-script@v7
        with:
          script: |
            const {publishPromotedRelease} = require('./dev/release-flow.cjs');
            await publishPromotedRelease({github, context, core});
