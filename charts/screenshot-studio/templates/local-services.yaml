{{- if .Values.local.enabled }}
{{- $fullName := include "screenshot-studio.fullname" . }}
{{- $secretName := required "local.enabled requires existingSecret" .Values.existingSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-postgres-init
data:
  10-init-databases.sh: |
    #!/usr/bin/env sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE ROLE screenshot_studio LOGIN PASSWORD '$POSTGRES_APP_PASSWORD';
    CREATE DATABASE screenshot_studio OWNER screenshot_studio;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-screenshot-mock
spec:
  ports:
    - name: http
      port: 5678
      targetPort: http
  selector:
    app.kubernetes.io/component: screenshot-mock
    {{- include "screenshot-studio.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-screenshot-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: screenshot-mock
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: screenshot-mock
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: screenshot-mock
          image: {{ .Values.local.screenshotMock.image | quote }}
          args:
            - "-listen=:5678"
            - >-
              -text={"status":"success","data":{"screenshot":{"url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFgAI/ScL6fQAAAABJRU5ErkJggg=="}}}
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/component: postgres
    {{- include "screenshot-studio.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.local.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_SUPER_PASSWORD
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_APP_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=postgres", "--dbname=postgres"]
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d/10-init-databases.sh
              subPath: 10-init-databases.sh
      volumes:
        - name: init
          configMap:
            name: {{ $fullName }}-postgres-init
            defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/component: redis
    {{- include "screenshot-studio.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.local.redis.image | quote }}
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-rustfs
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
  selector:
    app.kubernetes.io/component: rustfs
    {{- include "screenshot-studio.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rustfs
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rustfs
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.local.rustfs.image | quote }}
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/live
              port: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-rustfs-init
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rustfs-init
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rustfs-init
          image: {{ .Values.local.curlImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              bucket_url=http://{{ $fullName }}-rustfs:9000/$R2_BUCKET_NAME;
              if curl --fail --silent --head
              --aws-sigv4 "aws:amz:us-east-1:s3"
              --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY"
              "$bucket_url" >/dev/null 2>&1; then exit 0; fi;
              curl --fail --silent --show-error --request PUT
              --aws-sigv4 "aws:amz:us-east-1:s3"
              --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY"
              "$bucket_url" >/dev/null
          envFrom:
            - secretRef:
                name: {{ $secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-temporal
spec:
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
  selector:
    app.kubernetes.io/component: temporal
    {{- include "screenshot-studio.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: temporal
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: temporal
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: temporal
          image: {{ .Values.local.temporal.image | quote }}
          args: ["server", "start-dev", "--ip", "0.0.0.0"]
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
---
# The Go backend owns every database read and write; the web calls it with
# PUBLISHING_SERVICE_TOKEN. The migrate hook applies its schema.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-backend
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/component: backend
    {{- include "screenshot-studio.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "screenshot-studio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ required "local.backend.image is required when local.enabled" .Values.local.backend.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          env:
            - name: PORT
              value: "8080"
            - name: TEMPORAL_ADDRESS
              value: {{ printf "%s-temporal:7233" $fullName | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
{{- end }}
