name: Helm chart

on:
  pull_request:
    branches: [develop, main]
    paths:
      - infra/charts/**
      - .github/workflows/helm.yml
  push:
    branches: [develop, main]
    paths:
      - infra/charts/**
      - .github/workflows/helm.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/charts/screenshot-studio
      - run: helm template screenshot-studio infra/charts/screenshot-studio > rendered-chart.yaml
