name: screenshot-studio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    env_file: .local/dev.env
    environment:
      # The web has no database: every read and write goes through the Go
      # backend. Blank the connection strings the shared env_file provides.
      AUDIT_RETENTION_DATABASE_URL: ''
      DATABASE_URL: ''
      HOST_DATABASE_URL: ''
      STORAGE_API_URL: ''
      STORAGE_SERVICE_KEY: ''
      R2_ACCESS_KEY_ID: ''
      R2_SECRET_ACCESS_KEY: ''
      POSTIZ_API_KEY: ''
      POSTIZ_API_KEY_E2E: ''
      POSTIZ_API_KEY_SOCIAL_GATE: ''
      POSTIZ_API_URL: ''
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: development
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Slack, Notion, and Figma delivery (docs/integrations.md). Unset providers show as not set up.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      FIGMA_CLIENT_ID: ${FIGMA_CLIENT_ID:-}
      FIGMA_CLIENT_SECRET: ${FIGMA_CLIENT_SECRET:-}
      PLATFORM_CAMPAIGN_WORKFLOW: ${PLATFORM_CAMPAIGN_WORKFLOW:-enabled}
      PLATFORM_CONTENT_DRAFTS: ${PLATFORM_CONTENT_DRAFTS:-enabled}
      # The browser connects to the collaboration server directly. Only the
      # backend holds the collaboration secrets.
      PLATFORM_COLLAB_URL: ${PLATFORM_COLLAB_URL:-ws://localhost:1234}
      COLLAB_TOKEN_SECRET: ''
      COLLAB_SERVICE_TOKEN: ''
      # Set by bin/studio for e2e runs: a deterministic stand-in model (lib/ai/models/scripted.ts).
      PLATFORM_AI_SCRIPTED: ${PLATFORM_AI_SCRIPTED:-}
      # Set by bin/studio when render-browser runs. It shares this container's
      # network, so both sides use localhost.
      PLATFORM_DESIGN_RENDERER: ${PLATFORM_DESIGN_RENDERER:-}
      PLATFORM_RENDER_BASE_URL: http://localhost:3000
      PLATFORM_RENDER_CDP_URL: http://localhost:9222
      # The MCP server Settings → AI agents shows (./bin/studio postiz-go-up serves it).
      PLATFORM_MCP_URL: ${PLATFORM_MCP_URL:-http://localhost:3100/mcp}
      PUBLISHING_API_URL: ${PUBLISHING_API_URL:-http://publishing-backend:8080}
      PUBLISHING_SERVICE_TOKEN: ${PUBLISHING_SERVICE_TOKEN:-local-publishing-service}
      SCREENSHOT_API_URL: ${SCREENSHOT_API_URL:-https://api.microlink.io}
      SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS: ${SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS:-}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
      - app_next_cache:/workspace/.next
    depends_on:
      publishing-backend-ready:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # Headless Chrome for design renders, reached over CDP like Cloudflare
  # Browser Rendering in production. Started by `make up` unless
  # STUDIO_RENDERER=off or CI=true.
  render-browser:
    profiles: [renderer]
    image: chromedp/headless-shell:155.0.8059.40
    # Shares the app container's network namespace: Chrome loads the app at
    # localhost:3000, the origin the Next dev server serves dev assets to, and
    # the app reaches CDP at localhost:9222. Nothing is published.
    network_mode: service:app
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    env_file: .local/dev.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # TCP, not the socket: the init-time server is socket-only, and the
      # platform migrator connects over TCP as soon as this passes.
      test: ['CMD-SHELL', 'pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:63799:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.1
    env_file: .local/dev.env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9003:9000'
      - '127.0.0.1:9004:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-init:
    image: curlimages/curl:8.12.1
    env_file: .local/dev.env
    volumes:
      - ./infra/local/rustfs-init.sh:/rustfs-init.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/rustfs-init.sh']

  screenshot-mock:
    image: node:22-alpine
    profiles: ['e2e']
    command: node scripts/e2e-screenshot-mock.mjs
    working_dir: /workspace
    volumes:
      - .:/workspace:ro

  publishing-backend:
    build:
      context: ./services
      dockerfile: backend/Dockerfile
    image: screenshot-studio-publishing-backend:local
    env_file: .local/dev.env
    environment:
      PORT: '8080'
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PLATFORM_CAMPAIGN_WORKFLOW: ${PLATFORM_CAMPAIGN_WORKFLOW:-enabled}
      POSTIZ_API_URL: ${POSTIZ_API_URL:-https://api.postiz.com/public/v1}
      # Set by bin/social-gate for its isolated Go destination.
      POSTIZ_API_KEY_SOCIAL_GATE: ${POSTIZ_API_KEY_SOCIAL_GATE:-}
      PUBLISHING_RETRY_DELAY: ${PUBLISHING_RETRY_DELAY:-2m}
      PUBLISHING_SERVICE_TOKEN: ${PUBLISHING_SERVICE_TOKEN:-local-publishing-service}
      R2_BROWSER_ENDPOINT: http://localhost:9003
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      platform-go-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # Real-time co-editing of content drafts (RFC 037). It holds no database
  # credential: it authorizes, loads and stores only through the backend.
  collab:
    build:
      context: .
      dockerfile: packages/collab-server/Dockerfile
    image: screenshot-studio-collab:local
    environment:
      COLLAB_BACKEND_URL: http://publishing-backend:8080
      COLLAB_SERVICE_TOKEN: ${COLLAB_SERVICE_TOKEN:-}
    ports:
      - '127.0.0.1:1234:1234'
    depends_on:
      publishing-backend:
        condition: service_started

  # The backend image is distroless (no shell or HTTP client for a
  # healthcheck), so its readiness is probed from here.
  publishing-backend-ready:
    image: curlimages/curl:8.12.1
    command: --fail --silent --show-error --output /dev/null --retry 60 --retry-delay 1 --retry-all-errors http://publishing-backend:8080/readyz
    depends_on:
      publishing-backend:
        condition: service_started

  # Applies the product schema before the backend or worker starts.
  platform-go-migrate:
    build:
      context: ./services
      dockerfile: backend/Dockerfile
    image: screenshot-studio-publishing-backend:local
    entrypoint: ['/platform-migrate']
    environment:
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:1.8.2
    command: server start-dev --ip 0.0.0.0
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 2s
      retries: 30

  # Temporal worker for scheduled posts; the web no longer dispatches them.
  publishing-orchestrator:
    build:
      context: ./services
      dockerfile: orchestrator/Dockerfile
    env_file: .local/dev.env
    environment:
      PORT: '8081'
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      POSTIZ_API_URL: ${POSTIZ_API_URL:-https://api.postiz.com/public/v1}
      # Set by bin/social-gate for its isolated Go destination.
      POSTIZ_API_KEY_SOCIAL_GATE: ${POSTIZ_API_KEY_SOCIAL_GATE:-}
      PUBLISHING_RETRY_DELAY: ${PUBLISHING_RETRY_DELAY:-2m}
      RUN_CRON: ${RUN_CRON:-true}
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      platform-go-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  postiz-go-redis:
    profiles: ['postiz-go']
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - postiz_go_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  postiz-go-temporal:
    profiles: ['postiz-go']
    image: temporalio/temporal:1.8.2
    command: server start-dev --ip 0.0.0.0
    ports:
      - '127.0.0.1:7243:7233'
      - '127.0.0.1:8243:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 2s
      retries: 30

  screenshot-studio-backend:
    profiles: ['postiz-go']
    build:
      context: ./services
      dockerfile: screenshot-studio-backend/backend/Dockerfile
    image: screenshot-studio-postiz-backend:local
    # Local API shares the product database; the combined backend entrypoint
    # runs the tenant API and workers on a production host.
    entrypoint: ['/screenshot-studio-backend']
    environment:
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      REDIS_URL: redis://postiz-go-redis:6379
      TEMPORAL_ADDRESS: postiz-go-temporal:7233
      JWT_SECRET: ${POSTIZ_GO_JWT_SECRET:-local-postiz-go-only}
      FRONTEND_URL: ${POSTIZ_GO_FRONTEND_URL:-http://localhost:3000}
      MAIN_URL: http://localhost:3100
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3100
      BACKEND_INTERNAL_URL: http://screenshot-studio-backend:3000
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      X_API_KEY: ${POSTIZ_GO_X_API_KEY:-}
      X_API_SECRET: ${POSTIZ_GO_X_API_SECRET:-}
      FACEBOOK_APP_ID: ${POSTIZ_GO_FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${POSTIZ_GO_FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${POSTIZ_GO_INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${POSTIZ_GO_INSTAGRAM_APP_SECRET:-}
      STORAGE_PROVIDER: ${POSTIZ_GO_STORAGE_PROVIDER:-local}
      POSTIZ_PRIVATE_MEDIA: ${POSTIZ_PRIVATE_MEDIA:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ACCESS_KEY: ${CLOUDFLARE_ACCESS_KEY:-}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_REGION: ${CLOUDFLARE_REGION:-auto}
      CLOUDFLARE_BUCKETNAME: ${CLOUDFLARE_BUCKETNAME:-}
      CLOUDFLARE_BUCKET_URL: ${CLOUDFLARE_BUCKET_URL:-}
      UPLOAD_DIRECTORY: /tmp/postiz-uploads
      PORT: '3000'
      RUN_CRON: 'true'
      RUN_WORKER: 'true'
      # The MCP server (RFC 038) serves the same domain as publishing-backend:
      # its media bucket, its quota Redis, and its campaign rollout.
      PLATFORM_MCP_URL: http://localhost:3100/mcp
      PLATFORM_QUOTA_REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PLATFORM_CAMPAIGN_WORKFLOW: ${PLATFORM_CAMPAIGN_WORKFLOW:-enabled}
      R2_ENDPOINT: ${R2_ENDPOINT:-http://rustfs:9000}
      R2_BROWSER_ENDPOINT: http://localhost:9003
      R2_REGION: ${R2_REGION:-us-east-1}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-true}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      SCREENSHOT_API_URL: ${SCREENSHOT_API_URL:-https://api.microlink.io}
    ports:
      - '127.0.0.1:3100:3000'
      - '127.0.0.1:3102:3002'
    depends_on:
      platform-go-migrate:
        condition: service_completed_successfully
      postiz-go-redis:
        condition: service_healthy
      postiz-go-temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

volumes:
  app_next_cache:
  app_node_modules:
  postgres_data:
  postiz_go_redis_data:
  redis_data:
  rustfs_data:
