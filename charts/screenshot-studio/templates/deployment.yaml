apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "screenshot-studio.fullname" . }}
  labels:
    {{- include "screenshot-studio.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "screenshot-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "screenshot-studio.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "screenshot-studio.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.service.containerPort | quote }}
            - name: SCREENSHOT_API_URL
              value: {{ .Values.config.screenshotApiUrl | quote }}
            {{- with .Values.config.betterAuthUrl }}
            - name: BETTER_AUTH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.googleSiteVerification }}
            - name: GOOGLE_SITE_VERIFICATION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: DATABASE_URL
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: REDIS_URL
                  optional: true
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_ACCOUNT_ID
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_BUCKET_NAME
                  optional: true
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_ENDPOINT
                  optional: true
            - name: R2_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_REGION
                  optional: true
            - name: R2_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: R2_FORCE_PATH_STYLE
                  optional: true
            - name: STORAGE_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: STORAGE_API_URL
                  optional: true
            - name: STORAGE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: STORAGE_SERVICE_KEY
                  optional: true
            - name: STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: STORAGE_BUCKET
                  optional: true
            - name: CLEANUP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: CLEANUP_SECRET
                  optional: true
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
