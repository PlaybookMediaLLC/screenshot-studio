replicaCount: 1

image:
  repository: ghcr.io/playbookmediallc/screenshot-studio
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  containerPort: 3000

# Public NEXT_PUBLIC_* values are compiled into the browser bundle. Supply them
# as Docker build arguments when building the image, not as runtime values here.
config:
  betterAuthUrl: ""
  googleSiteVerification: ""
  screenshotApiUrl: "https://api.microlink.io"

# Optional Secret containing any of: DATABASE_URL, REDIS_URL, R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, CLEANUP_SECRET.
# REDIS_URL is required when the screenshot API route is enabled.
existingSecret: ""

# Development-only dependencies. `bin/studio kind-up` enables this group through
# values-kind.yaml. Production deployments must use managed services instead.
local:
  enabled: false
  postgres:
    image: postgres:16-bookworm
  pgbouncer:
    image: bitnamilegacy/pgbouncer:latest
  redis:
    image: redis:7.4-alpine
  minio:
    image: minio/minio:latest
    clientImage: minio/mc:latest
  storage:
    image: supabase/storage-api:v1.37.8
  curlImage: curlimages/curl:8.12.1
  imgproxy:
    image: darthsim/imgproxy:v3.26.0

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: screenshot-studio.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: screenshot-studio
      sectionName: http
  hostnames:
    - screenshot-studio.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

startupProbe:
  httpGet:
    path: /api/health
    port: http
  failureThreshold: 18
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /api/health
    port: http

readinessProbe:
  httpGet:
    path: /api/health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
