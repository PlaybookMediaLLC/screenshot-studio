name: Web image

on:
  push:
    branches: [main]
    paths:
      - clients/apps/web/**
      - '!clients/apps/web/test/**'
      - clients/package.json
      - clients/package-lock.json
      - clients/packages/**
      - server/internal/medialimits/limits.json
      - .github/workflows/web-image.yml
      - infra/digitalocean/update-web-image.py
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy this commit to production (pushes to main deploy automatically)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish web
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: clients/apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/playbookmediallc/screenshot-studio:web-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
          cache-from: type=gha,scope=screenshot-studio-web
          cache-to: type=gha,mode=max,ignore-error=true,scope=screenshot-studio-web
      - name: Verify public image pull
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "ghcr.io/playbookmediallc/screenshot-studio@$IMAGE_DIGEST"

  # The backend owns migrations. When this commit also changed it, the web
  # deploys only after the backend deploy of the same commit succeeds. This
  # job holds no deploy lock, so the backend deploy is never blocked by it.
  backend-first:
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for this commit's backend deploy
        run: |
          set -euo pipefail
          while :; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow social-backend-image.yml \
              --commit "$GITHUB_SHA" --event push --json status,conclusion \
              --jq 'if length == 0 then "none" else "\(.[0].status) \(.[0].conclusion)" end')"
            case "$run" in
              none) echo "This commit did not change the backend."; exit 0 ;;
              "completed success") echo "Backend deployed."; exit 0 ;;
              completed*) echo "Backend run ended as: $run; not deploying web." >&2; exit 1 ;;
            esac
            sleep 30
          done

  # Every push to main deploys the web.
  deploy:
    needs: [publish, backend-first]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: do-app-${{ github.repository }}-${{ vars.SCREENSHOT_STUDIO_APP_ID }}
      cancel-in-progress: false
    env:
      APP_ID: ${{ vars.SCREENSHOT_STUDIO_APP_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Load scoped production credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.SCREENSHOT_STUDIO_INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.SCREENSHOT_STUDIO_INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /screenshot-studio
          include-imports: 'false'
          recursive: 'false'
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_PRODUCTION_TOKEN }}
          version: 1.180.0
      - name: Deploy web
        run: |
          set -euo pipefail
          umask 077
          test -n "$APP_ID"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          doctl apps get "$APP_ID" -o json > "$work/before.json"
          # Skip only when production already runs a newer commit; commits that
          # touch no web path never run this workflow.
          live="$(jq -r '.[0].spec.services[] | select(.name == "web") | .image.tag // ""' "$work/before.json")"
          live_sha="${live#web-}"
          if test -n "$live_sha" && test "$live_sha" != "$GITHUB_SHA" &&
            test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live_sha" --jq .status 2>/dev/null)" = ahead; then
            echo "Skipped: production already runs $live, which is newer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 infra/digitalocean/update-web-image.py \
            --base "$work/before.json" --tag "web-$GITHUB_SHA" \
            --from-infisical-env --output "$work/spec.json"
          doctl apps propose --app "$APP_ID" --spec "$work/spec.json" -o json > "$work/proposal.json"
          doctl apps update "$APP_ID" --spec "$work/spec.json" --wait > "$work/update.log"
          doctl apps get "$APP_ID" -o json > "$work/after.json"
          test "$(jq -r '.[0].spec.services[] | select(.name == "web") | .image.tag' "$work/after.json")" = "web-$GITHUB_SHA"
          test "$(jq -r '.[0].active_deployment.phase // empty' "$work/after.json")" = ACTIVE
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://shots.playbookmedia.io/api/health > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://shots.playbookmedia.io/indexnow-key.txt > "$work/indexnow-key.txt"
          diff clients/apps/web/public/indexnow-key.txt "$work/indexnow-key.txt"
          # With the collab service live, the composer must point at it and it
          # must answer; otherwise drafts silently lose live co-editing.
          if jq -e '.[0].spec.services[] | select(.name == "collab")' "$work/after.json" > /dev/null; then
            test "$(jq -r '.[0].spec.services[] | select(.name == "web") | .envs[] | select(.key == "PLATFORM_COLLAB_URL") | .value' "$work/after.json")" = "wss://shots.playbookmedia.io/collab"
            curl --fail --silent --show-error --retry 6 --retry-delay 5 https://shots.playbookmedia.io/collab/health | grep -q '"ok"'
            echo "Collaboration: live at wss://shots.playbookmedia.io/collab" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Web active: https://cloud.digitalocean.com/apps/$APP_ID" >> "$GITHUB_STEP_SUMMARY"
