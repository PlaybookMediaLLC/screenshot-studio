name: screenshot-studio

services:
  app:
    build:
      context: ..
      dockerfile: clients/apps/web/Dockerfile.dev
    command: npm run dev
    working_dir: /workspace/clients
    env_file: ../.local/dev.env
    environment:
      # The web has no database: every read and write goes through the Go
      # backend. Blank the connection strings the shared env_file provides.
      AUDIT_RETENTION_DATABASE_URL: ''
      DATABASE_URL: ''
      HOST_DATABASE_URL: ''
      STORAGE_API_URL: ''
      STORAGE_SERVICE_KEY: ''
      R2_ACCESS_KEY_ID: ''
      R2_SECRET_ACCESS_KEY: ''
      SOCIAL_API_KEY: ''
      SOCIAL_API_KEY_E2E: ''
      SOCIAL_API_KEY_E2E_W0: ''
      SOCIAL_API_KEY_E2E_W1: ''
      SOCIAL_API_KEY_E2E_W2: ''
      SOCIAL_API_KEY_E2E_W3: ''
      SOCIAL_API_KEY_E2E_W4: ''
      SOCIAL_API_KEY_E2E_W5: ''
      SOCIAL_API_KEY_E2E_W6: ''
      SOCIAL_API_KEY_E2E_W7: ''
      SOCIAL_API_KEY_GATE: ''
      SOCIAL_API_URL: ''
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: development
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Notion and Figma delivery. Slack credentials are backend-only.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      SLACK_CLIENT_ID: ''
      SLACK_CLIENT_SECRET: ''
      PLATFORM_NOTIFICATION_ENCRYPTION_KEY: ''
      PLATFORM_WEBHOOK_ENCRYPTION_KEY: ''
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      FIGMA_CLIENT_ID: ${FIGMA_CLIENT_ID:-}
      FIGMA_CLIENT_SECRET: ${FIGMA_CLIENT_SECRET:-}
      PLATFORM_CAMPAIGN_WORKFLOW: ${PLATFORM_CAMPAIGN_WORKFLOW:-enabled}
      PLATFORM_CREATIVE_SETS: ${PLATFORM_CREATIVE_SETS:-internal}
      PLATFORM_CONTENT_DRAFTS: ${PLATFORM_CONTENT_DRAFTS:-enabled}
      # The browser connects to the collaboration server directly. Only the
      # backend holds the collaboration secrets.
      PLATFORM_COLLAB_URL: ${PLATFORM_COLLAB_URL:-ws://localhost:1234}
      COLLAB_TOKEN_SECRET: ''
      COLLAB_SERVICE_TOKEN: ''
      # Set by dev/studio for e2e runs: a deterministic stand-in model (lib/ai/models/scripted.ts).
      PLATFORM_AI_SCRIPTED: ${PLATFORM_AI_SCRIPTED:-}
      # Set by dev/studio when render-browser runs. It shares this container's
      # network, so both sides use localhost.
      PLATFORM_DESIGN_RENDERER: ${PLATFORM_DESIGN_RENDERER:-}
      PLATFORM_RENDER_BASE_URL: http://localhost:3000
      PLATFORM_RENDER_CDP_URL: http://localhost:9222
      # The MCP server Settings → AI agents shows (publishing-backend serves it).
      PLATFORM_MCP_URL: ${PLATFORM_MCP_URL:-http://localhost:3100/mcp}
      PUBLISHING_API_URL: ${PUBLISHING_API_URL:-http://publishing-backend:8080}
      PUBLISHING_SERVICE_TOKEN: ${PUBLISHING_SERVICE_TOKEN:-local-publishing-service}
      SCREENSHOT_API_URL: ${SCREENSHOT_API_URL:-https://api.microlink.io}
      SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS: ${SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS:-}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ..:/workspace
      - app_node_modules:/workspace/clients/node_modules
      - app_next_cache:/workspace/clients/apps/web/.next
    depends_on:
      publishing-backend-ready:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # Headless Chrome for design renders, reached over CDP like Cloudflare
  # Browser Rendering in production. Started by `make up` unless
  # STUDIO_RENDERER=off or CI=true.
  render-browser:
    profiles: [renderer]
    image: chromedp/headless-shell:155.0.8059.40
    # Shares the app container's network namespace: Chrome loads the app at
    # localhost:3000, the origin the Next dev server serves dev assets to, and
    # the app reaches CDP at localhost:9222. Nothing is published.
    network_mode: service:app
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    env_file: ../.local/dev.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # TCP, not the socket: the init-time server is socket-only, and the
      # platform migrator connects over TCP as soon as this passes.
      test: ['CMD-SHELL', 'pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:63799:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.1
    env_file: ../.local/dev.env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9003:9000'
      - '127.0.0.1:9004:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-init:
    image: curlimages/curl:8.12.1
    env_file: ../.local/dev.env
    volumes:
      - ../infra/local/rustfs-init.sh:/rustfs-init.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/rustfs-init.sh']

  screenshot-mock:
    image: node:22.23.4-alpine
    profiles: ['e2e']
    command: node clients/apps/web/scripts/e2e-screenshot-mock.mjs
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro

  # The Go services share the production image; each one selects its binary.
  publishing-backend:
    build:
      context: ../server
    image: screenshot-studio-backend:local
    entrypoint: ['/publishing-backend']
    env_file: ../.local/dev.env
    environment:
      PLATFORM_NOTIFICATION_ENCRYPTION_KEY: ${PLATFORM_NOTIFICATION_ENCRYPTION_KEY:-}
      PLATFORM_SOCIAL_ENCRYPTION_KEY: ${PLATFORM_SOCIAL_ENCRYPTION_KEY:-}
      PLATFORM_SOCIAL_ENCRYPTION_PREVIOUS_KEY: ${PLATFORM_SOCIAL_ENCRYPTION_PREVIOUS_KEY:-}
      # Seals outbound webhook secrets (RFC 024); unset, webhooks are unavailable.
      PLATFORM_WEBHOOK_ENCRYPTION_KEY: ${PLATFORM_WEBHOOK_ENCRYPTION_KEY:-}
      PLATFORM_ACTIVITY_LEGACY_PAUSED: ${PLATFORM_ACTIVITY_LEGACY_PAUSED:-true}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      PLATFORM_SLACK_CALLBACK_URL: ${PLATFORM_SLACK_CALLBACK_URL:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PORT: '8080'
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # The web requires email verification only in production; invitation
      # responses follow it, or locally signed-up members could not accept.
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      PLATFORM_CAMPAIGN_WORKFLOW: ${PLATFORM_CAMPAIGN_WORKFLOW:-enabled}
      PLATFORM_CREATIVE_SETS: ${PLATFORM_CREATIVE_SETS:-internal}
      # Channel connections run in process: the provider apps and their media
      # storage. Unset, SOCIAL_API_URL keeps them in process; the browser e2e
      # suite points it at a social API mock.
      SOCIAL_API_URL: ${SOCIAL_API_URL:-}
      JWT_SECRET: ${SOCIAL_JWT_SECRET:-local-social-only}
      FRONTEND_URL: ${SOCIAL_FRONTEND_URL:-http://localhost:3000}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      X_API_KEY: ${SOCIAL_X_API_KEY:-}
      X_API_SECRET: ${SOCIAL_X_API_SECRET:-}
      THREADS_APP_ID: ${SOCIAL_THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${SOCIAL_THREADS_APP_SECRET:-}
      MASTODON_CLIENT_ID: ${SOCIAL_MASTODON_CLIENT_ID:-}
      MASTODON_CLIENT_SECRET: ${SOCIAL_MASTODON_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${SOCIAL_FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${SOCIAL_FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${SOCIAL_INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${SOCIAL_INSTAGRAM_APP_SECRET:-}
      STORAGE_PROVIDER: ${SOCIAL_STORAGE_PROVIDER:-local}
      SOCIAL_PRIVATE_MEDIA: ${SOCIAL_PRIVATE_MEDIA:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ACCESS_KEY: ${CLOUDFLARE_ACCESS_KEY:-}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_REGION: ${CLOUDFLARE_REGION:-auto}
      CLOUDFLARE_BUCKETNAME: ${CLOUDFLARE_BUCKETNAME:-}
      CLOUDFLARE_BUCKET_URL: ${CLOUDFLARE_BUCKET_URL:-}
      UPLOAD_DIRECTORY: /tmp/social-uploads
      # The MCP server (RFC 026) and its OAuth endpoints on the public port.
      PUBLIC_PORT: '3000'
      PLATFORM_MCP_URL: http://localhost:3100/mcp
      # Enable only after a disposable live Bluesky connection has been verified.
      PLATFORM_SOCIAL_BLUESKY_ENABLED: ${PLATFORM_SOCIAL_BLUESKY_ENABLED:-false}
      PLATFORM_SOCIAL_CUSTOM_MASTODON_ENABLED: ${PLATFORM_SOCIAL_CUSTOM_MASTODON_ENABLED:-false}
      PUBLISHING_RETRY_DELAY: ${PUBLISHING_RETRY_DELAY:-2m}
      PUBLISHING_SERVICE_TOKEN: ${PUBLISHING_SERVICE_TOKEN:-local-publishing-service}
      R2_BROWSER_ENDPOINT: http://localhost:9003
      TEMPORAL_ADDRESS: temporal:7233
      # The onboarding agent (docs/rfcs/032). dev/studio points the model and
      # the fetch allowlist at the e2e fakes; without a key, drafts come from
      # page metadata, and enrichment providers without a key are skipped.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      PLATFORM_ONBOARDING_AGENT: ${PLATFORM_ONBOARDING_AGENT:-enabled}
      PLATFORM_ONBOARDING_SURFACES: ${PLATFORM_ONBOARDING_SURFACES:-}
      PLATFORM_ENRICHMENT_DISABLED: ${PLATFORM_ENRICHMENT_DISABLED:-}
      PLATFORM_ENRICHMENT_EXA_API_KEY: ${PLATFORM_ENRICHMENT_EXA_API_KEY:-}
      PLATFORM_ENRICHMENT_GITHUB_TOKEN: ${PLATFORM_ENRICHMENT_GITHUB_TOKEN:-}
      PLATFORM_SENTRY_DSN: ${PLATFORM_SENTRY_DSN:-}
      SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS: ${SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS:-}
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:3100:3000'
    depends_on:
      platform-go-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # Real-time co-editing of content drafts (RFC 013). It holds no database
  # credential: it authorizes, loads and stores only through the backend.
  collab:
    build:
      context: ..
      dockerfile: clients/apps/collab-server/Dockerfile
    image: screenshot-studio-collab:local
    environment:
      COLLAB_BACKEND_URL: http://publishing-backend:8080
      COLLAB_SERVICE_TOKEN: ${COLLAB_SERVICE_TOKEN:-}
    ports:
      - '127.0.0.1:1234:1234'
    depends_on:
      publishing-backend:
        condition: service_started

  # The backend image is distroless (no shell or HTTP client for a
  # healthcheck), so its readiness is probed from here.
  publishing-backend-ready:
    image: curlimages/curl:8.12.1
    command: --fail --silent --show-error --output /dev/null --retry 60 --retry-delay 1 --retry-all-errors http://publishing-backend:8080/readyz
    depends_on:
      publishing-backend:
        condition: service_started

  # Applies the product schema before the backend or worker starts.
  platform-go-migrate:
    build:
      context: ../server
    image: screenshot-studio-backend:local
    entrypoint: ['/platform-migrate']
    environment:
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:1.8.2
    command: server start-dev --ip 0.0.0.0
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 2s
      retries: 30

  # Temporal worker for scheduled posts; the web no longer dispatches them.
  publishing-orchestrator:
    build:
      context: ../server
    image: screenshot-studio-backend:local
    entrypoint: ['/publishing-orchestrator']
    env_file: ../.local/dev.env
    environment:
      PLATFORM_NOTIFICATION_ENCRYPTION_KEY: ${PLATFORM_NOTIFICATION_ENCRYPTION_KEY:-}
      PLATFORM_SOCIAL_ENCRYPTION_KEY: ${PLATFORM_SOCIAL_ENCRYPTION_KEY:-}
      PLATFORM_SOCIAL_ENCRYPTION_PREVIOUS_KEY: ${PLATFORM_SOCIAL_ENCRYPTION_PREVIOUS_KEY:-}
      # Seals outbound webhook secrets (RFC 024); unset, webhooks are unavailable.
      PLATFORM_WEBHOOK_ENCRYPTION_KEY: ${PLATFORM_WEBHOOK_ENCRYPTION_KEY:-}
      PLATFORM_ACTIVITY_LEGACY_PAUSED: ${PLATFORM_ACTIVITY_LEGACY_PAUSED:-true}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      PLATFORM_SLACK_CALLBACK_URL: ${PLATFORM_SLACK_CALLBACK_URL:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      PORT: '8081'
      DATABASE_URL: postgresql://screenshot_studio:${POSTGRES_APP_PASSWORD}@postgres:5432/screenshot_studio?sslmode=disable
      PUBLISHING_RETRY_DELAY: ${PUBLISHING_RETRY_DELAY:-2m}
      RUN_CRON: ${RUN_CRON:-true}
      TEMPORAL_ADDRESS: temporal:7233
      # The onboarding agent (docs/rfcs/032). dev/studio points the model and
      # the fetch allowlist at the e2e fakes; without a key, drafts come from
      # page metadata, and enrichment providers without a key are skipped.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      PLATFORM_ONBOARDING_AGENT: ${PLATFORM_ONBOARDING_AGENT:-enabled}
      PLATFORM_ONBOARDING_SURFACES: ${PLATFORM_ONBOARDING_SURFACES:-}
      PLATFORM_ENRICHMENT_DISABLED: ${PLATFORM_ENRICHMENT_DISABLED:-}
      PLATFORM_ENRICHMENT_EXA_API_KEY: ${PLATFORM_ENRICHMENT_EXA_API_KEY:-}
      PLATFORM_ENRICHMENT_GITHUB_TOKEN: ${PLATFORM_ENRICHMENT_GITHUB_TOKEN:-}
      PLATFORM_SENTRY_DSN: ${PLATFORM_SENTRY_DSN:-}
      SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS: ${SCREENSHOT_E2E_ALLOWED_DOWNLOAD_HOSTS:-}
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      platform-go-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

volumes:
  app_next_cache:
  app_node_modules:
  postgres_data:
  redis_data:
  rustfs_data:
