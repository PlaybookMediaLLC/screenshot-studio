name: Social backend image

on:
  push:
    branches: [main]
    paths:
      - services/screenshot-studio-backend/**
      - services/backend/**
      - services/cmd/**
      - services/ent/**
      - services/orchestrator/**
      - services/internal/**
      - services/platformmigrations/**
      - services/go.mod
      - services/go.sum
      - .github/workflows/social-backend-image.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Replace the four legacy backend services in production
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish combined backend
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services
          file: services/screenshot-studio-backend/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/playbookmediallc/screenshot-studio:social-backend-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=social-backend
          cache-to: type=gha,mode=max,ignore-error=true,scope=social-backend
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Social backend image: ghcr.io/playbookmediallc/screenshot-studio@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public pull
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "ghcr.io/playbookmediallc/screenshot-studio@$IMAGE_DIGEST"

  deploy:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: do-app-${{ github.repository }}-${{ vars.SCREENSHOT_STUDIO_APP_ID }}
      cancel-in-progress: false
    env:
      APP_ID: ${{ vars.SCREENSHOT_STUDIO_APP_ID }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Load scoped production credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.SCREENSHOT_STUDIO_INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.SCREENSHOT_STUDIO_INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /screenshot-studio
          include-imports: 'false'
          recursive: 'false'
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_PRODUCTION_TOKEN }}
          version: 1.180.0
      - name: Cut over to the combined backend
        run: |
          set -euo pipefail
          umask 077
          test -n "$APP_ID"
          test -n "$IMAGE_DIGEST"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head_sha" = "$GITHUB_SHA"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          doctl apps get "$APP_ID" -o json > "$work/before.json"
          previous_id="$(jq -r '.[0].active_deployment.id // empty' "$work/before.json")"
          python3 infra/digitalocean/consolidate-live-spec.py \
            --base "$work/before.json" --digest "$IMAGE_DIGEST" \
            --tag "social-backend-$GITHUB_SHA" \
            --from-infisical-env --output "$work/spec.json"
          doctl apps propose --app "$APP_ID" --spec "$work/spec.json" -o json > "$work/proposal.json"
          doctl apps update "$APP_ID" --spec "$work/spec.json" --wait > "$work/update.log"
          doctl apps get "$APP_ID" -o json > "$work/after.json"
          test "$(jq -r '.[0].spec.services | length' "$work/after.json")" -le 4
          test "$(jq -r '.[0].spec.services[] | select(.name == "screenshot-studio-backend") | .image.tag' "$work/after.json")" = "social-backend-$GITHUB_SHA"
          if test "$(jq -r '.[0].active_deployment.id // empty' "$work/after.json")" = "$previous_id"; then
            test "$(jq -r '.[0].spec.services[] | select(.name == "screenshot-studio-backend") | .image.tag' "$work/before.json")" = "social-backend-$GITHUB_SHA"
          fi
          test "$(jq -r '.[0].active_deployment.phase // empty' "$work/after.json")" = ACTIVE
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://shots.oppulence.io/api/health > /dev/null
          echo "Combined backend active: https://cloud.digitalocean.com/apps/$APP_ID" >> "$GITHUB_STEP_SUMMARY"
